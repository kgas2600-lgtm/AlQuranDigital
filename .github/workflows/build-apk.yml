name: Build Al-Quran Digital APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cari ZIP Project
        shell: bash
        run: |
          set -e

          echo "=== MENCARI ZIP PROJECT ==="

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=== EXTRACT PROJECT ==="

          rm -rf source
          mkdir -p source

          unzip -o "$ZIP_FILE" -d source

          echo "Project berhasil diekstrak."

      - name: Cari Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find source -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cek Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== STRUKTUR PROJECT ==="

          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: folder app tidak ditemukan!"
            exit 1
          fi

          echo "Folder app ditemukan."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILD APK"
          echo "================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Cek APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MENCARI APK"
          echo "================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Selesai
        if: success()
        run: |
          echo "========================================"
          echo "✅ BUILD APK BERHASIL!"
          echo "========================================"
