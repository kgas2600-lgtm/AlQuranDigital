name: Build Al-Quran Digital APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cari ZIP Project
        shell: bash
        run: |
          set -e

          echo "=== MENCARI ZIP PROJECT ==="

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -o "$ZIP_FILE" -d source

          echo "=== HASIL EXTRACT ==="
          find source -maxdepth 5 -type f | head -150

      - name: Cari Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS=$(find source \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project tidak ditemukan!"
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cek Struktur Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== PROJECT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== BUILD APK ==="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Cari APK
        shell: bash
        run: |
          echo "=== HASIL APK ==="

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Berhasil
        if: success()
        run: |
          echo "================================"
          echo "✅ APK BERHASIL DIBUAT"
          echo "================================"
