name: Build Al-Quran Digital APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. CHECKOUT
      # ==============================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # 2. SETUP JDK 17
      # ==============================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==============================
      # 3. SETUP GRADLE
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==============================
      # 4. CARI ZIP
      # ==============================
      - name: Cari ZIP Project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MENCARI ZIP PROJECT"
          echo "================================"

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==============================
      # 5. EXTRACT ZIP
      # ==============================
      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "EXTRACT PROJECT"
          echo "================================"

          rm -rf source
          mkdir -p source

          unzip -o "$ZIP_FILE" -d source

          echo ""
          echo "Isi project:"
          find source -maxdepth 5 -type f | head -200


      # ==============================
      # 6. CARI ANDROID PROJECT
      # ==============================
      - name: Cari Android Project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MENCARI ANDROID PROJECT"
          echo "================================"

          SETTINGS_FILE=$(find source \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==============================
      # 7. CEK PROJECT
      # ==============================
      - name: Cek Struktur Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "STRUKTUR PROJECT"
          echo "================================"

          pwd

          echo ""
          echo "Isi project:"
          ls -la

          echo ""
          echo "Folder app:"
          ls -la app


      # ==============================
      # 8. CEK GRADLE WRAPPER
      # ==============================
      - name: Cek Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "CEK GRADLE WRAPPER"
          echo "================================"

          if [ -f "./gradlew" ]; then

            echo "gradlew ditemukan."

            chmod +x ./gradlew

            echo "Menggunakan Gradle Wrapper."
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

          else

            echo "gradlew tidak ditemukan."

            echo "Menggunakan Gradle 8.9."
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

          fi


      # ==============================
      # 9. BUILD APK
      # ==============================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILD AL-QURAN DIGITAL APK"
          echo "================================"

          $GRADLE_CMD clean assembleDebug \
            --no-daemon \
            --stacktrace


      # ==============================
      # 10. CARI APK
      # ==============================
      - name: Cari APK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MENCARI APK"
          echo "================================"

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi


      # ==============================
      # 11. UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ==============================
      # 12. BERHASIL
      # ==============================
      - name: Build Berhasil
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "       ✅ APK BERHASIL DIBUAT"
          echo "======================================"
          echo ""
          echo "Buka Artifacts untuk mengambil APK."
