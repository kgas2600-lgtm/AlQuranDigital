name: Build Al-Quran Digital APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf source
          unzip -o AlQuranDigitalAndroid_cloudbuild_v2.zip -d source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java and Kotlin JVM target
        working-directory: source/AlQuranDigitalAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "android {\n",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              )

          p.write_text(text)
          PY

      - name: Build Debug APK
        working-directory: source/AlQuranDigitalAndroid
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-debug
          path: source/AlQuranDigitalAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
