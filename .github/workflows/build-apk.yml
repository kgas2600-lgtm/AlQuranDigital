name: Build Al-Quran Digital APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cari ZIP project
        shell: bash
        run: |
          set -e

          echo "Mencari file ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf source
          mkdir -p source

          unzip -o "$ZIP_FILE" -d source

      - name: Tampilkan struktur project
        run: |
          echo "=== STRUKTUR PROJECT ==="
          find source -maxdepth 4 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cari project Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find source -type f -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan!"
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Cari APK
        run: |
          echo "=== APK ==="
          find source -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
