name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o AlQuranDigitalAndroid_cloudbuild.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM target
        working-directory: extracted/AlQuranDigitalAndroid
        run: |
          python3 - <<'PY'
          p = "app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              'android {',
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }'''
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        working-directory: extracted/AlQuranDigitalAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuranDigital-APK
          path: extracted/AlQuranDigitalAndroid/app/build/outputs/apk/debug/app-debug.apk
